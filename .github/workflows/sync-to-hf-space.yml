name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two syncs race; the Hub is a single mutable target.
concurrency:
  group: sync-to-hf-space
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest --run

  # Data-contract checks against the live warehouse. They depend on data that
  # is republished daily, so they report but never block the sync.
  integrity:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integrity
        env:
          SNAPSHOT_URL: https://huggingface.co/datasets/evaleval/card_backend/resolve/main/warehouse/latest

  sync:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # hub-sync uploads file *contents* over HTTP, so LFS objects must be
          # materialised here. Without this the Space receives pointer text
          # instead of the screenshots and org logos.
          lfs: true

      - uses: huggingface/hub-sync@v0.3.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: evaleval/general-eval-card
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_type: space
          space_sdk: docker
